[package]
name = "bridgectl"
description = "A tool that aims to solve all your cat-dev bridge interaction needs."
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
# Is a CLI tool with a potentially common name, people can build it/use our packages with scripts included.
publish = false

[dependencies]
cat-dev = { default-features = false, features = ["clients", "serial", "scientists", "servers"], path = "../../pkg/cat-dev" }
clap = { version = "^4.5.30", features = ["color", "derive", "env", "error-context", "help", "suggestions", "unicode", "usage", "wrap_help"] }
fnv.workspace = true
futures.workspace = true
log = { path = "../../pkg/log" }
mac_address.workspace = true
miette.workspace = true
terminal_size = "^0.4.1"
tokio.workspace = true
tracing.workspace = true
valuable.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "^0.2"