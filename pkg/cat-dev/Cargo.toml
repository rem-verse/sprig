[package]
name = "cat-dev"
description = "A library for interacting with the CAT-DEV hardware units distributed by Nintendo (i.e. a type of Wii-U DevKits)."
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
aes = "^0.8.4"
bytes.workspace = true
cipher = { version = "^0.4.4", features = ["alloc", "block-padding"] }
configparser = "^3.1.0"
ecb = "^0.1.2"
fnv.workspace = true
futures = "^0.3.31"
local-ip-address = "^0.6.3"
mac_address.workspace = true
miette.workspace = true
network-interface.workspace = true
pin-project-lite = "^0.2.15"
reqwest = "^0.12.9"
serde = "^1.0.214"
serde_urlencoded = "^0.7.1"
thiserror = "^2.0.3"
tracing.workspace = true
tokio.workspace = true
tokio-util = { version = "^0.7.12", default-features = false, features = ["codec"] }
valuable.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "macos"))'.dependencies]
libc = "^0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "^0.58.0", default-features = false, features=["Win32_Devices_Communication", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Registry", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "^3.14.0"

[package.metadata.docs.rs]
rustc-args = ["--cfg", "tokio_unstable", "--cfg", "tracing_unstable"]
rustdoc-args = ["--cfg", "tokio_unstable", "--cfg", "tracing_unstable"]